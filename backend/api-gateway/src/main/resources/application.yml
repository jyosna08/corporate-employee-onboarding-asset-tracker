server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://hr-auth.onrender.com}
          predicates: [ Path=/api/auth/** ]
        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URL:https://hr-employee.onrender.com}
          predicates: [ Path=/api/employees/** ]
        - id: asset-service
          uri: ${ASSET_SERVICE_URL:https://hr-asset.onrender.com}
          predicates: [ Path=/api/assets/** ]
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
            allowedHeaders: [ Authorization, Content-Type, Accept ]
            exposedHeaders: [ Location ]
            allowCredentials: true
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
    loadbalancer:
      cache:
        ttl: ${LOADBALANCER_CACHE_TTL:5s}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    secret: ${JWT_SECRET}
