server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: asset-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          employee-service:
            connectTimeout: ${EMPLOYEE_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${EMPLOYEE_READ_TIMEOUT_MS:2000}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true
resilience4j:
  circuitbreaker:
    instances:
      employee-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - feign.FeignException$NotFound
