services:
  discovery-server:
    build:
      context: ./backend
      dockerfile: discovery-server/Dockerfile
    environment:
      SERVER_PORT: 8761
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "java -version >/dev/null 2>&1"]
      interval: 10s
      timeout: 4s
      retries: 12

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["auth_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  employee-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["employee_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d employee_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  asset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asset_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["asset_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d asset_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://auth-db:5432/auth_db
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD}
    depends_on:
      auth-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  employee-service:
    build:
      context: ./backend
      dockerfile: employee-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://employee-db:5432/employee_db
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      employee-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  asset-service:
    build:
      context: ./backend
      dockerfile: asset-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      DATABASE_URL: jdbc:postgresql://asset-db:5432/asset_db
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_URL: http://discovery-server:8761/eureka
      EMPLOYEE_CONNECT_TIMEOUT_MS: ${EMPLOYEE_CONNECT_TIMEOUT_MS}
      EMPLOYEE_READ_TIMEOUT_MS: ${EMPLOYEE_READ_TIMEOUT_MS}
    depends_on:
      asset-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      employee-service: { condition: service_started }

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT}
    depends_on:
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_started }
      employee-service: { condition: service_started }
      asset-service: { condition: service_started }
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on: [api-gateway]
    ports: ["3000:80"]

volumes:
  auth_data:
  employee_data:
  asset_data:
